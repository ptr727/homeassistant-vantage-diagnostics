rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: No brand images yet.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: The integration declares no requirements and uses the aiovantage the stock integration installs.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: The flow only picks a loaded stock entry and makes no connection.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The stock integration holds the credentials and handles reauthentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: The integration follows a stock entry and discovers nothing.
  discovery-update-info:
    status: exempt
    comment: The integration follows a stock entry and discovers nothing.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The only setting is the stock entry followed, which a user changes by adding a new entry.
  repair-issues:
    status: exempt
    comment: The integration has no issues a user can fix through a repair.
  stale-devices:
    status: exempt
    comment: The devices belong to the stock integration, which removes them.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The aiovantage library talks to the controller over raw TCP, not HTTP.
  strict-typing: done
